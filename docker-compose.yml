services:
  jupyter:
    build: ./notebooks
    container_name: orgiq-jupyter
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./notebooks:/workspace
      - ~/.aws:/root/.aws:ro
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - AWS_PROFILE=${AWS_PROFILE:-default}
    working_dir: /workspace
    restart: unless-stopped
    networks:
      - orgiq-network

  middleware:
    build:
      context: ./middleware
      target: development
      additional_contexts:
        realtime_modules: ../websocket-gateway/realtime-modules
    container_name: orgiq-middleware
    ports:
      - "3001:3001"
    volumes:
      - ./middleware/src:/app/src
      - ./middleware/.env.aws:/app/.env.aws:ro
      - ~/.aws:/root/.aws:ro
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - NODE_ENV=development
      - PORT=3001
    restart: unless-stopped
    networks:
      - orgiq-network

  portal:
    build:
      context: ./portal
      target: development
      additional_contexts:
        ui_components: ../ui-components
        realtime_modules: ../websocket-gateway/realtime-modules
    container_name: orgiq-portal
    ports:
      - "5183:5183"
    volumes:
      - ./portal:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_WS_URL=ws://localhost:3001
      - API_PROXY_TARGET=http://middleware:3001
    restart: unless-stopped
    networks:
      - orgiq-network

networks:
  orgiq-network:
    driver: bridge
