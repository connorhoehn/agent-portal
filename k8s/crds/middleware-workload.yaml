apiVersion: distributed-core.dev/v1alpha1
kind: Workload
metadata:
  name: orgiq-middleware
  namespace: orgiq
spec:
  kind: Deployment
  image: connorhoehn/orgiq-middleware:dev  # placeholder; manual push needed (see docs/deploy-via-operator.md)
  replicas: 2
  ports:
    - containerPort: 3001
      name: http
  env:
    - name: PORT
      value: '3001'
    - name: NODE_ENV
      value: 'production'
    - name: WEBSOCKET_GATEWAY_URL
      value: 'http://gateway.platform.svc.cluster.local'
    - name: GATEWAY_SERVICE_AUTH_SECRET
      valueFrom:
        secretKeyRef:
          name: orgiq-service-auth
          key: secret
    - name: GATEWAY_SERVICE_AUTH_CLIENT_ID
      value: 'orgiq-middleware'
    - name: AWS_REGION
      value: 'us-east-1'
    # Production placeholders: the middleware refuses to start while either is
    # REPLACE_ME (securityPreconditions). Fill before applying; for a local
    # cluster set INSECURE_DEV_MODE: 'true' in an overlay instead.
    # ARN of the Secrets Manager secret that holds the session signing key.
    - name: SESSION_SIGNING_SECRET_ARN
      value: 'REPLACE_ME'
    # Id of the Verified Permissions policy store.
    - name: POLICY_STORE_ID
      value: 'REPLACE_ME'
