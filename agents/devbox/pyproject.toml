[project]
name = "orgiq-devbox"
version = "0.1.0"
description = "OrgIQ Devbox - Claude Code hosted in an AgentCore Runtime microVM (Bedrock-authenticated, persistent /mnt/workspace)"
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
