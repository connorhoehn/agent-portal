[project]
name = "orgiq-assessment-scorer"
version = "0.1.0"
description = "OrgIQ Assessment Scorer Agent - classifies evidence and scores teams against the 17-dimension engineering-maturity rubric"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.55",
    "bedrock-agentcore[ag-ui]>=1.9",
    "boto3>=1.34",
    "ag-ui-protocol>=0.1.18",
    "ag-ui-strands>=0.1.8",
]

# No test extra: the suite in tests/ is stdlib `unittest` only, run with
#   cd agents/assessment-scorer && ../../.venv-synth/bin/python -m unittest discover -s . -p 'test_*.py'
# It declared `test = ["pytest>=8"]` until 2026-09, which is why those tests
# sat unrun: pytest is not in the synth venv and the box is offline.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
