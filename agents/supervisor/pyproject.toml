[project]
name = "orgiq-supervisor"
version = "0.1.0"
description = "OrgIQ Supervisor Agent - orchestrates sub-agents via A2A"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.55",
    "strands-agents-builder>=0.1",
    "bedrock-agentcore[a2a,ag-ui]>=1.9",
    "ag-ui-protocol>=0.1.18",
    "ag-ui-strands>=0.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
