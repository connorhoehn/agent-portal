name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  middleware:
    # The suite (8,300 tests) overran a single hosted runner; three shards finish in parallel.
    name: middleware (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: middleware
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The checkout credential is scoped to this repo and would override the
          # dependency token in the rewritten github: URLs (npm ci "Repository not found").
          persist-credentials: false
      # The github: dependencies (distributed-core, service-runtime, ...) are private
      # repositories. The workflow token only reads this repository, so a personal
      # access token with read access to the dependency repositories is required:
      # a classic PAT with the `repo` scope from an account that can read them,
      # stored as the GH_PACKAGES_TOKEN secret (repository or organisation level).
      - name: "Check the dependency token"
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::error::GH_PACKAGES_TOKEN secret is not set. npm ci cannot fetch the private github: dependencies without it. Create a PAT with read access to the connorhoehn dependency repositories and add it as a repository secret named GH_PACKAGES_TOKEN."
            exit 1
          fi
      - name: "Let npm fetch github: dependencies"
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: middleware/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Work demo story
        if: matrix.shard == 1
        run: node ../scripts/content/check-story.mjs
      - name: Doc links
        if: matrix.shard == 1
        run: node ../scripts/docs/check-links.mjs
      - name: Test
        env:
          # 25% of a hosted runner is one worker and the suite overran 45 minutes.
          JEST_MAX_WORKERS: '3'
        run: npm test -- --shard=${{ matrix.shard }}/3
  voice-inventory:
    # Node only, no install: fails when docs/voice-tool-inventory.json is stale or a
    # write route a person can reach has no voice catalogue decision.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Voice tool inventory
        run: node scripts/voice/inventory.mjs --check
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The checkout credential is scoped to this repo and would override the
          # dependency token in the rewritten github: URLs (npm ci "Repository not found").
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The checkout credential is scoped to this repo and would override the
          # dependency token in the rewritten github: URLs (npm ci "Repository not found").
          persist-credentials: false
      # The github: dependencies (distributed-core, service-runtime, ...) are private
      # repositories. The workflow token only reads this repository, so a personal
      # access token with read access to the dependency repositories is required:
      # a classic PAT with the `repo` scope from an account that can read them,
      # stored as the GH_PACKAGES_TOKEN secret (repository or organisation level).
      - name: "Check the dependency token"
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::error::GH_PACKAGES_TOKEN secret is not set. npm ci cannot fetch the private github: dependencies without it. Create a PAT with read access to the connorhoehn dependency repositories and add it as a repository secret named GH_PACKAGES_TOKEN."
            exit 1
          fi
      - name: "Let npm fetch github: dependencies"
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run build && npm test
      # realtime-modules 0.147.0 put async_hooks (service-runtime) in the browser
      # bundle and every page rendered blank; the built assets must stay Node-free.
      - name: Production bundle has no Node-only code
        run: node scripts/check-bundle-node-free.mjs
      - name: Dev server listens on loopback by default
        run: node scripts/check-dev-server.mjs
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The checkout credential is scoped to this repo and would override the
          # dependency token in the rewritten github: URLs (npm ci "Repository not found").
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: schema/synth/requirements.txt
      - run: pip install -r schema/synth/requirements.txt
      - name: Shared helper tests
        working-directory: agents/_shared
        run: python -m unittest discover
      - name: Agent tool tests
        working-directory: agents/tests
        run: python -m unittest discover
      - name: Devbox agent tests
        working-directory: agents/devbox
        run: python -m unittest discover
      - name: Supervisor agent tests
        working-directory: agents/supervisor
        run: python -m unittest discover
